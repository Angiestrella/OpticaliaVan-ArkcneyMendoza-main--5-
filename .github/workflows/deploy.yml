# Compila la página y la publica en GitHub Pages cada vez que se sube algo a main.
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpticaliaVan-ArkcneyMendoza-main
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        # El sitio vive en https://<usuario>.github.io/<repositorio>/,
        # por eso se compila con esa carpeta como base.
        run: |
          pnpm exec tsc -b
          pnpm exec vite build --base=/${{ github.event.repository.name }}/

      - name: Permitir abrir cualquier ruta directamente (ej. /catalogo)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: OpticaliaVan-ArkcneyMendoza-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
